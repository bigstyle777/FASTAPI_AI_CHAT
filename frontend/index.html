<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="stars" id="stars"></div>

    <div id="loginPage" class="login-page">
        <div class="login-container">
            <h1>AI Chat Pro</h1>
            <div class="tabs">
                <button id="loginTab" class="tab active">登录</button>
                <button id="registerTab" class="tab">注册</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input id="loginUsername" type="text" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input id="loginPassword" type="password" placeholder="请输入密码">
                </div>
                <button id="loginBtn" type="button">登录</button>
            </form>

            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>用户名</label>
                    <input id="registerUsername" type="text" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input id="registerPassword" type="password" placeholder="请输入密码，至少 6 位">
                </div>
                <button id="registerBtn" type="button">注册</button>
            </form>
        </div>
    </div>

    <div id="mainPage" class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>AI Chat Pro</h2>
                <p>你的智能助手</p>
            </div>
            <button id="newChatBtn">+ 新建聊天</button>
            <div id="sessionList"></div>
            <div class="sidebar-footer">
                <button id="profileBtn" class="profile-btn">个人中心</button>
                <button id="logoutBtn" class="logout-btn">退出登录</button>
            </div>
        </div>

        <div class="chat">
            <div id="messageNotice" class="notice"></div>
            <div id="messages"></div>
            <div class="input-area">
                <input id="messageInput" type="text" placeholder="输入消息，开始对话...">
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <div id="profilePage" class="profile-page" style="display: none;">
        <div class="profile-container">
            <button id="backBtn" class="back-btn">返回</button>
            <h1>个人中心</h1>

            <div class="profile-section">
                <h2>用户信息</h2>
                <div class="info-row">
                    <label>用户名</label>
                    <span id="profileUsername">--</span>
                </div>
                <div class="info-row">
                    <label>用户 ID</label>
                    <span id="profileUserId">--</span>
                </div>
            </div>

            <div class="profile-section">
                <h2>API 设置</h2>
                <div class="form-group">
                    <label>API Key</label>
                    <input id="apiKeyInput" type="password" placeholder="请输入你的 API Key">
                    <button id="toggleApiKeyBtn" class="toggle-btn">显示</button>
                </div>
                <div class="form-group">
                    <label>Provider</label>
                    <select id="providerSelect">
                        <option value="deepseek">DeepSeek</option>
                        <option value="openai">OpenAI</option>
                    </select>
                </div>
                <button id="saveSettingsBtn" class="save-btn">保存设置</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
