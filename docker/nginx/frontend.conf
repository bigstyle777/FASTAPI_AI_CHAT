# 前端容器 Nginx 配置：
# - 托管 Vite 构建产物，SPA history 路由回退到 index.html
# - 将后端 API 反向代理到 compose 网络内的 backend 服务（与 vite.config.ts 的 dev proxy 对齐）
# - SSE 流式接口（/chat/stream、/agent/stream 等）依赖 api_proxy.conf 中的禁缓冲配置

upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # 不泄露 nginx 版本号
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（HSTS 需 HTTPS 后才可启用，见下方注释）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 部署 HTTPS 后启用：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 如前端无内联脚本/外链 CDN，可启用 CSP（先用 report-only 观察）：
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # RAG 文件上传体积上限
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /memories 精确匹配：列表/创建接口没有子路径
    location = /memories {
        proxy_pass http://backend_api;
        include /etc/nginx/api_proxy.conf;
    }

    # API 前缀代理（/users /chat /admin /rag /memories /agent 下的子路径）。
    # 正则要求前缀后必须跟 "/"，因此 /chat、/admin 精确路径不会被代理，
    # 而是落入下方 SPA 回退 —— 与开发环境 Vite 的行为一致。
    location ~ ^/(users|chat|admin|rag|memories|agent)/ {
        proxy_pass http://backend_api;
        include /etc/nginx/api_proxy.conf;
    }

    # 静态资源 + SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
